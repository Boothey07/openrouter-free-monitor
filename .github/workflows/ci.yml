name: CI

# Central definitions: Boothey07/ci-workflows, pinned to v1.4.
# pull_request only — adding `push` too would double-bill every PR.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  hygiene:
    uses: Boothey07/ci-workflows/.github/workflows/pr-hygiene.yml@v1.5

  secrets:
    uses: Boothey07/ci-workflows/.github/workflows/secrets.yml@v1.4

  python:
    uses: Boothey07/ci-workflows/.github/workflows/python-ci.yml@v1.4
    with:
      paths: "."
      python-versions: '["3.12"]'
      # Measured at rollout: 14 ruff E9,F errors at rollout
      strict-lint: false
      # No test suite wired yet — a green Test job that ran nothing reads as coverage.
      run-tests: false
